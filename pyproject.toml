[project]
name = "treasury-auction-stress"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Nathan Yang" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
]

[project.scripts]
treasury-auction-stress = "treasury_auction_stress:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.3",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
# Live-network tests hit real external APIs (Treasury Fiscal Data, NY
# Fed Primary Dealer Statistics) and are excluded by default so the
# normal test suite stays deterministic and offline.
# Run them explicitly with: uv run pytest -o addopts="" -m live_network
# (the `-o addopts=""` is required: `addopts` below already sets
# `-m 'not live_network'`, and passing a second `-m` on the command
# line does not reliably override it -- clearing addopts first is the
# only version-independent way to select only the live tests.)
addopts = "-m 'not live_network'"
markers = [
    "live_network: requires internet access to the real Treasury Fiscal Data API",
]
