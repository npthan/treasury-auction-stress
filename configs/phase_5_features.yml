# Phase 5 feature contract -- the single machine-readable source of
# truth for every field this project's predictor matrices, target
# table, and audit tables carry. Generated artifacts/phase_5_feature_
# dictionary.md is rendered directly from this file by
# treasury_auction_stress.features.feature_manifest -- do not maintain
# a second, hand-written copy of this information anywhere else.
#
# Every entry's `default_tier` was assigned using economic mechanism,
# source semantics, historical availability, redundancy, and
# interpretability -- NEVER by examining a relationship with any
# target (primary_dealer_share, direct_bidder_share,
# indirect_bidder_share, bid_to_cover_ratio). No feature-target
# correlation, mutual information, p-value, or model-performance
# metric was computed or consulted while writing this file.
#
# `feature_role` values: identifier, cutoff_metadata, predictor,
# audit_provenance, target, target_diagnostic, target_construction_only,
# excluded.
#
# `default_tier` values: core, extended, audit_only, excluded.
#
# A `name_pattern` entry (instead of a literal `canonical_feature_name`)
# describes a *family* of columns that share one construction and one
# risk profile -- used for per-source-series and per-RTDSM-variable
# audit/provenance columns, where dozens of near-identical columns
# (one per series or per macro variable) would otherwise force
# needless, non-informative repetition. Every predictor and target
# column actually materialized in the Phase 5 matrices has its own
# literal `canonical_feature_name` entry, never only a pattern.

metadata:
  document: "Phase 5 point-in-time feature contract"
  status: "implemented, pending independent acceptance review"
  auction_key_definition: "cusip + '_' + auction_date.date().isoformat() -- a stable, deterministic string key; never row position"
  sample: "ordinary_modeling_sample (treasury_auction_stress.features.eligibility.select_modeling_sample), 1,279 rows as of this session -- see artifacts/phase_5_feature_matrix.md for the exact count observed at generation time"
  cutoffs:
    - announcement: "public information as of the end of announcemt_date (date-level, per docs/point_in_time_rules.md)"
    - pre_auction: "public information as of the end of pre_auction_cutoff_date, the previous U.S. federal business day before auction_date"

features:

  # ============================================================
  # Identifiers and cutoff metadata
  # ============================================================

  - canonical_feature_name: auction_key
    source_family: identifier
    source_field_or_derivation: "derived: cusip + '_' + auction_date.date().isoformat()"
    description: "Stable, deterministic per-auction identity key; never row position."
    economic_rationale: "n/a -- bookkeeping key, not an economic quantity"
    transformation: "string concatenation"
    unit: "n/a"
    dtype: "string"
    applicable_forecast_cutoff: [announcement, pre_auction]
    required_lookback: "none"
    minimum_history: "none"
    availability_provenance: "known exactly at announcement time"
    missingness_meaning: "never missing for an eligible row"
    schema_period_limitations: "none"
    feature_role: identifier
    default_tier: excluded
    leakage_risk: "none"
    leakage_mitigation: "n/a; excluded from modeling by feature_role, never passed to a model as a categorical predictor (high cardinality, one level per auction)"

  - canonical_feature_name: cusip
    source_family: identifier
    source_field_or_derivation: "Fiscal Data auctions API field cusip"
    description: "The security's CUSIP identifier."
    economic_rationale: "n/a -- identity field"
    transformation: "none"
    unit: "n/a"
    dtype: "string"
    applicable_forecast_cutoff: [announcement, pre_auction]
    required_lookback: "none"
    minimum_history: "none"
    availability_provenance: "known exactly at announcement time"
    missingness_meaning: "never missing"
    schema_period_limitations: "none"
    feature_role: identifier
    default_tier: excluded
    leakage_risk: "high-cardinality security identity would let a model memorize a specific security's own historical outcome"
    leakage_mitigation: "retained only as identifier/index metadata, per task instruction; never exposed as a categorical predictor"

  - canonical_feature_name: auction_date
    source_family: identifier
    source_field_or_derivation: "Fiscal Data auctions API field auction_date"
    description: "The calendar date the auction itself is held."
    economic_rationale: "n/a -- identity/timing field"
    transformation: "none"
    unit: "date"
    dtype: "datetime64[ns]"
    applicable_forecast_cutoff: [announcement, pre_auction]
    required_lookback: "none"
    minimum_history: "none"
    availability_provenance: "known exactly at announcement time (the announcement discloses the auction date)"
    missingness_meaning: "never missing"
    schema_period_limitations: "none"
    feature_role: identifier
    default_tier: excluded
    leakage_risk: "none directly, but treated as index metadata, not an ordinary predictor, per task instruction"
    leakage_mitigation: "n/a"

  - canonical_feature_name: tenor
    source_family: auction_structure
    source_field_or_derivation: "normalize.py's tenor (== original_security_term for nominal-coupon rows)"
    description: "The auction's nominal-coupon tenor (2/3/5/7/10/20/30-Year), 7 categorical levels."
    economic_rationale: "Dealer take-down, curve positioning, and CFTC/dealer-inventory relevance all differ systematically by tenor; the single most important structural grouping variable in this project."
    transformation: "none (categorical passthrough; encoding deferred to Phase 6 training folds)"
    unit: "categorical, 7 levels"
    dtype: "string"
    applicable_forecast_cutoff: [announcement, pre_auction]
    required_lookback: "none"
    minimum_history: "none"
    availability_provenance: "known exactly at announcement time"
    missingness_meaning: "never missing for an eligible row"
    schema_period_limitations: "20-Year has no history before its 2020-05-20 reintroduction"
    feature_role: predictor
    default_tier: core
    leakage_risk: "none"
    leakage_mitigation: "n/a"

  - canonical_feature_name: announcemt_date
    source_family: cutoff_metadata
    source_field_or_derivation: "Fiscal Data auctions API field announcemt_date"
    description: "The calendar date this auction's terms were publicly announced (API's own field spelling)."
    economic_rationale: "n/a -- cutoff-defining field"
    transformation: "none"
    unit: "date"
    dtype: "datetime64[ns]"
    applicable_forecast_cutoff: [announcement, pre_auction]
    required_lookback: "none"
    minimum_history: "none"
    availability_provenance: "n/a"
    missingness_meaning: "never missing"
    schema_period_limitations: "none"
    feature_role: cutoff_metadata
    default_tier: audit_only
    leakage_risk: "none"
    leakage_mitigation: "n/a"

  - canonical_feature_name: announcement_cutoff_date
    source_family: cutoff_metadata
    source_field_or_derivation: "auction_cutoffs.add_cutoff_dates: normalize(announcemt_date)"
    description: "The announcement-time prediction cutoff for this auction."
    economic_rationale: "n/a -- defines the announcement matrix's own cutoff"
    transformation: "date normalization"
    unit: "date"
    dtype: "datetime64[ns]"
    applicable_forecast_cutoff: [announcement]
    required_lookback: "none"
    minimum_history: "none"
    availability_provenance: "n/a"
    missingness_meaning: "never missing"
    schema_period_limitations: "none"
    feature_role: cutoff_metadata
    default_tier: audit_only
    leakage_risk: "none"
    leakage_mitigation: "n/a"

  - canonical_feature_name: pre_auction_cutoff_date
    source_family: cutoff_metadata
    source_field_or_derivation: "auction_cutoffs.add_cutoff_dates: previous_business_day(auction_date)"
    description: "The pre-auction prediction cutoff for this auction (previous U.S. federal business day before auction_date)."
    economic_rationale: "n/a -- defines the pre-auction matrix's own cutoff"
    transformation: "previous-business-day calendar calculation"
    unit: "date"
    dtype: "datetime64[ns]"
    applicable_forecast_cutoff: [pre_auction]
    required_lookback: "none"
    minimum_history: "none"
    availability_provenance: "n/a"
    missingness_meaning: "never missing"
    schema_period_limitations: "Federal Reserve holiday calendar, not SIFMA bond-market holidays (disclosed Good Friday divergence)"
    feature_role: cutoff_metadata
    default_tier: audit_only
    leakage_risk: "none"
    leakage_mitigation: "n/a"

  # ============================================================
  # Auction structure predictors (core)
  # ============================================================

  - canonical_feature_name: is_reopening
    source_family: auction_structure
    source_field_or_derivation: "normalize.py's is_reopening (== reopening == 'Yes')"
    description: "Whether this auction reopens an existing CUSIP rather than issuing a new one."
    economic_rationale: "A reopening adds to an already-trading, liquid CUSIP; a new issue starts a fresh line -- economically distinct for dealer absorption (docs/project_plan.md)."
    transformation: "none"
    unit: "boolean"
    dtype: "bool"
    applicable_forecast_cutoff: [announcement, pre_auction]
    required_lookback: "none"
    minimum_history: "none"
    availability_provenance: "known exactly at announcement time"
    missingness_meaning: "never missing"
    schema_period_limitations: "none"
    feature_role: predictor
    default_tier: core
    leakage_risk: "none"
    leakage_mitigation: "n/a"

  - canonical_feature_name: offering_amt
    source_family: auction_structure
    source_field_or_derivation: "Fiscal Data auctions API field offering_amt"
    description: "The publicly announced offering amount, in dollars."
    economic_rationale: "The single largest determinant of how much supply the market (and dealers) must absorb."
    transformation: "none"
    unit: "USD"
    dtype: "Float64"
    applicable_forecast_cutoff: [announcement, pre_auction]
    required_lookback: "none"
    minimum_history: "none"
    availability_provenance: "known exactly at announcement time"
    missingness_meaning: "never missing for an eligible row"
    schema_period_limitations: "two verified restricted primary-dealer-only auctions ($25,000,000) are excluded from the modeling sample entirely (docs/target_specification.md)"
    feature_role: predictor
    default_tier: core
    leakage_risk: "none"
    leakage_mitigation: "n/a"

  - canonical_feature_name: log_offering_amt
    source_family: auction_structure
    source_field_or_derivation: "auction_candidate_features.add_offering_amount_features: log1p(offering_amt)"
    description: "log1p of the offering amount."
    economic_rationale: "Offering sizes span orders of magnitude; structural size effects (e.g. dealer_absorption.py's own offering_slope) are naturally linear in log-size."
    transformation: "log1p, fixed and deterministic"
    unit: "log(USD)"
    dtype: "float64"
    applicable_forecast_cutoff: [announcement, pre_auction]
    required_lookback: "none"
    minimum_history: "none"
    availability_provenance: "known exactly at announcement time"
    missingness_meaning: "never missing for an eligible row"
    schema_period_limitations: "none beyond offering_amt's own"
    feature_role: predictor
    default_tier: core
    leakage_risk: "none"
    leakage_mitigation: "n/a"

  - canonical_feature_name: days_announcement_to_auction
    source_family: auction_structure
    source_field_or_derivation: "auction_candidate_features.add_announcement_to_auction_gap: (auction_date - announcemt_date).days"
    description: "Calendar days between the public announcement and the auction itself."
    economic_rationale: "A longer or shorter run-up window can affect how much of the market has positioned ahead of the auction."
    transformation: "date subtraction"
    unit: "days"
    dtype: "int64"
    applicable_forecast_cutoff: [announcement, pre_auction]
    required_lookback: "none"
    minimum_history: "none"
    availability_provenance: "both dates known exactly at announcement time"
    missingness_meaning: "never missing for an eligible row"
    schema_period_limitations: "none"
    feature_role: predictor
    default_tier: core
    leakage_risk: "none"
    leakage_mitigation: "n/a"

  - canonical_feature_name: auction_month
    source_family: auction_structure
    source_field_or_derivation: "auction_candidate_features.add_calendar_features: auction_date.dt.month"
    description: "Calendar month (1-12) of the auction date."
    economic_rationale: "Treasury's issuance calendar and dealer balance-sheet capacity (e.g. quarter-end constraints) have seasonal structure."
    transformation: "date component extraction"
    unit: "month number, 1-12"
    dtype: "int32"
    applicable_forecast_cutoff: [announcement, pre_auction]
    required_lookback: "none"
    minimum_history: "none"
    availability_provenance: "known exactly at announcement time"
    missingness_meaning: "never missing"
    schema_period_limitations: "none"
    feature_role: predictor
    default_tier: core
    leakage_risk: "none"
    leakage_mitigation: "n/a"

  - canonical_feature_name: auction_quarter
    source_family: auction_structure
    source_field_or_derivation: "auction_candidate_features.add_calendar_features: auction_date.dt.quarter"
    description: "Calendar quarter (1-4) of the auction date."
    economic_rationale: "Quarter-end dealer balance-sheet/regulatory constraints (e.g. SLR reporting dates) can affect willingness to warehouse new supply."
    transformation: "date component extraction"
    unit: "quarter number, 1-4"
    dtype: "int32"
    applicable_forecast_cutoff: [announcement, pre_auction]
    required_lookback: "none"
    minimum_history: "none"
    availability_provenance: "known exactly at announcement time"
    missingness_meaning: "never missing"
    schema_period_limitations: "none"
    feature_role: predictor
    default_tier: core
    leakage_risk: "none"
    leakage_mitigation: "n/a"

  - canonical_feature_name: auction_day_of_week
    source_family: auction_structure
    source_field_or_derivation: "auction_candidate_features.add_calendar_features: auction_date.dt.dayofweek"
    description: "Day of week (0=Monday .. 6=Sunday) of the auction date."
    economic_rationale: "Treasury's auction calendar clusters heavily by weekday; captures residual weekday structure not otherwise represented."
    transformation: "date component extraction"
    unit: "day-of-week code, 0-6"
    dtype: "int32"
    applicable_forecast_cutoff: [announcement, pre_auction]
    required_lookback: "none"
    minimum_history: "none"
    availability_provenance: "known exactly at announcement time"
    missingness_meaning: "never missing"
    schema_period_limitations: "none"
    feature_role: predictor
    default_tier: core
    leakage_risk: "none"
    leakage_mitigation: "n/a"

  - canonical_feature_name: announcement_day_of_week
    source_family: auction_structure
    source_field_or_derivation: "auction_candidate_features.add_calendar_features: announcemt_date.dt.dayofweek"
    description: "Day of week (0=Monday .. 6=Sunday) of the announcement date."
    economic_rationale: "Verified (artifacts/phase_3_primary_dealer_integration.md): the overwhelming majority of announcements fall on Thursday, the same day NY Fed publishes dealer statistics -- worth capturing directly as a predictor, not only via the safe-availability join logic."
    transformation: "date component extraction"
    unit: "day-of-week code, 0-6"
    dtype: "int32"
    applicable_forecast_cutoff: [announcement, pre_auction]
    required_lookback: "none"
    minimum_history: "none"
    availability_provenance: "known exactly at announcement time"
    missingness_meaning: "never missing"
    schema_period_limitations: "none"
    feature_role: predictor
    default_tier: core
    leakage_risk: "none"
    leakage_mitigation: "n/a"

  # ============================================================
  # Auction structure predictors (extended -- historical/trailing)
  # ============================================================

  - canonical_feature_name: previous_same_tenor_offering_amt
    source_family: auction_structure
    source_field_or_derivation: "auction_candidate_features.add_previous_same_tenor_features: merge_asof(backward, allow_exact_matches=False) per tenor"
    description: "The offering amount of the most recent strictly-earlier same-tenor auction."
    economic_rationale: "Recent same-tenor supply is a natural anchor for what 'normal' issuance looks like for this tenor right now."
    transformation: "as-of lookup, strictly excluding same-day announcements"
    unit: "USD"
    dtype: "float64"
    applicable_forecast_cutoff: [announcement, pre_auction]
    required_lookback: "one prior same-tenor announcement"
    minimum_history: "the tenor's own first announcement (e.g. 2020-05-20 for 20-Year)"
    availability_provenance: "derived entirely from strictly-earlier announcements, each already public by construction"
    missingness_meaning: "missing for a tenor's first-ever announcement in this project's history -- never backfilled"
    schema_period_limitations: "20-Year: missing before its 2020 reintroduction's second auction"
    feature_role: predictor
    default_tier: extended
    leakage_risk: "same-day announcement ties (verified: 35 real rows in this project's data) could make two simultaneous announcements appear to precede each other"
    leakage_mitigation: "merge_asof allow_exact_matches=False structurally excludes same-day matches; tested in tests/test_auction_candidate_features.py"

  - canonical_feature_name: change_in_offering_amt_vs_previous_same_tenor
    source_family: auction_structure
    source_field_or_derivation: "auction_candidate_features.add_previous_same_tenor_features: offering_amt - previous_same_tenor_offering_amt"
    description: "This auction's offering amount minus the previous same-tenor auction's offering amount."
    economic_rationale: "A supply increase or decrease relative to the tenor's own recent norm is a more direct 'surprise' signal than the level alone."
    transformation: "subtraction"
    unit: "USD"
    dtype: "float64"
    applicable_forecast_cutoff: [announcement, pre_auction]
    required_lookback: "one prior same-tenor announcement"
    minimum_history: "same as previous_same_tenor_offering_amt"
    availability_provenance: "same as previous_same_tenor_offering_amt"
    missingness_meaning: "same as previous_same_tenor_offering_amt"
    schema_period_limitations: "same as previous_same_tenor_offering_amt"
    feature_role: predictor
    default_tier: extended
    leakage_risk: "same as previous_same_tenor_offering_amt"
    leakage_mitigation: "same as previous_same_tenor_offering_amt"

  - canonical_feature_name: days_since_prior_same_tenor_auction
    source_family: auction_structure
    source_field_or_derivation: "auction_candidate_features.add_previous_same_tenor_features: auction_date - previous same-tenor auction_date"
    description: "Calendar days since the previous same-tenor auction was actually held."
    economic_rationale: "A longer or shorter gap since the last same-tenor auction can indicate calendar irregularities (e.g. debt-limit-driven schedule shifts) relevant to market absorption capacity."
    transformation: "date subtraction on an as-of lookup"
    unit: "days"
    dtype: "float64"
    applicable_forecast_cutoff: [announcement, pre_auction]
    required_lookback: "one prior same-tenor announcement"
    minimum_history: "same as previous_same_tenor_offering_amt"
    availability_provenance: "both dates known no later than this row's own announcement"
    missingness_meaning: "same as previous_same_tenor_offering_amt"
    schema_period_limitations: "same as previous_same_tenor_offering_amt"
    feature_role: predictor
    default_tier: extended
    leakage_risk: "same as previous_same_tenor_offering_amt"
    leakage_mitigation: "same as previous_same_tenor_offering_amt"

  - canonical_feature_name: n_prior_reopenings_of_cusip
    source_family: auction_structure
    source_field_or_derivation: "auction_candidate_features.add_prior_reopening_count: cumulative count of strictly-earlier same-CUSIP reopenings"
    description: "How many earlier auctions share this row's CUSIP and are themselves reopenings."
    economic_rationale: "A security reopened many times is typically more seasoned/liquid than a freshly-issued one, which can affect dealer willingness to warehouse further reopenings."
    transformation: "as-of cumulative count, strictly excluding same-day announcements"
    unit: "count"
    dtype: "int64"
    applicable_forecast_cutoff: [announcement, pre_auction]
    required_lookback: "full same-CUSIP history to date"
    minimum_history: "none (0 for a CUSIP's first appearance)"
    availability_provenance: "derived entirely from strictly-earlier announcements"
    missingness_meaning: "never missing (0 rather than missing for a CUSIP's first appearance)"
    schema_period_limitations: "none"
    feature_role: predictor
    default_tier: extended
    leakage_risk: "same-day reopenings of the same CUSIP (not observed in this project's data, but structurally possible) could count each other"
    leakage_mitigation: "as-of lookup against a per-distinct-date cumulative count, never same-day precedence; tested"

  - canonical_feature_name: trailing_nominal_coupon_supply_8
    source_family: auction_structure
    source_field_or_derivation: "auction_candidate_features.add_trailing_supply_features: trailing sum of offering_amt over the 8 most recent distinct prior announcement dates, all tenors pooled"
    description: "Total announced nominal-coupon offering amount over the 8 most recent distinct prior announcement dates (approximately one month, given this project's ~6.4 announcements/month cadence)."
    economic_rationale: "Aggregate recent supply across all tenors is a proxy for how much new Treasury paper the market has had to absorb lately, independent of this auction's own tenor."
    transformation: "distinct-date trailing sum, window pre-specified by cadence"
    unit: "USD"
    dtype: "float64"
    applicable_forecast_cutoff: [announcement, pre_auction]
    required_lookback: "8 distinct prior announcement dates"
    minimum_history: "the first 8 distinct announcement dates of this project's sample"
    availability_provenance: "derived entirely from strictly-earlier announcements"
    missingness_meaning: "missing until 8 distinct prior announcement dates exist"
    schema_period_limitations: "none"
    feature_role: predictor
    default_tier: extended
    leakage_risk: "a same-day batch of auctions (verified common: up to 4 auctions announced on one date) could otherwise see each other's supply"
    leakage_mitigation: "same-day auctions are aggregated into one shift(1)-excluded slot before the rolling window; tested"

  - canonical_feature_name: trailing_nominal_coupon_supply_26
    source_family: auction_structure
    source_field_or_derivation: "auction_candidate_features.add_trailing_supply_features: trailing sum of offering_amt over the 26 most recent distinct prior announcement dates, all tenors pooled"
    description: "Total announced nominal-coupon offering amount over the 26 most recent distinct prior announcement dates (approximately one quarter)."
    economic_rationale: "Same as trailing_nominal_coupon_supply_8, at a longer (quarterly) horizon."
    transformation: "distinct-date trailing sum, window pre-specified by cadence"
    unit: "USD"
    dtype: "float64"
    applicable_forecast_cutoff: [announcement, pre_auction]
    required_lookback: "26 distinct prior announcement dates"
    minimum_history: "the first 26 distinct announcement dates of this project's sample"
    availability_provenance: "derived entirely from strictly-earlier announcements"
    missingness_meaning: "missing until 26 distinct prior announcement dates exist"
    schema_period_limitations: "none"
    feature_role: predictor
    default_tier: extended
    leakage_risk: "same as trailing_nominal_coupon_supply_8"
    leakage_mitigation: "same as trailing_nominal_coupon_supply_8"

  - canonical_feature_name: trailing_same_tenor_supply_4
    source_family: auction_structure
    source_field_or_derivation: "auction_candidate_features.add_trailing_supply_features: trailing sum of offering_amt over the 4 most recent distinct prior same-tenor announcement dates"
    description: "Total announced offering amount over the 4 most recent distinct prior announcements of this row's own tenor."
    economic_rationale: "Recent same-tenor supply trend, independent of the immediately-previous single auction's level."
    transformation: "distinct-date trailing sum within tenor, window pre-specified by cadence"
    unit: "USD"
    dtype: "float64"
    applicable_forecast_cutoff: [announcement, pre_auction]
    required_lookback: "4 distinct prior same-tenor announcement dates"
    minimum_history: "the tenor's own first 4 distinct announcement dates"
    availability_provenance: "derived entirely from strictly-earlier same-tenor announcements"
    missingness_meaning: "missing until 4 distinct prior same-tenor announcement dates exist"
    schema_period_limitations: "20-Year: missing for its first several post-2020 auctions"
    feature_role: predictor
    default_tier: extended
    leakage_risk: "verified same-day same-tenor ties (35 rows) could otherwise see each other's supply"
    leakage_mitigation: "same-day same-tenor auctions are aggregated into one shift(1)-excluded slot before the rolling window; tested directly against this real scenario"

  - canonical_feature_name: trailing_same_tenor_supply_8
    source_family: auction_structure
    source_field_or_derivation: "auction_candidate_features.add_trailing_supply_features: trailing sum of offering_amt over the 8 most recent distinct prior same-tenor announcement dates"
    description: "Total announced offering amount over the 8 most recent distinct prior announcements of this row's own tenor."
    economic_rationale: "Same as trailing_same_tenor_supply_4, at a longer lookback."
    transformation: "distinct-date trailing sum within tenor, window pre-specified by cadence"
    unit: "USD"
    dtype: "float64"
    applicable_forecast_cutoff: [announcement, pre_auction]
    required_lookback: "8 distinct prior same-tenor announcement dates"
    minimum_history: "the tenor's own first 8 distinct announcement dates"
    availability_provenance: "derived entirely from strictly-earlier same-tenor announcements"
    missingness_meaning: "missing until 8 distinct prior same-tenor announcement dates exist"
    schema_period_limitations: "20-Year: missing for a longer initial span than trailing_same_tenor_supply_4"
    feature_role: predictor
    default_tier: extended
    leakage_risk: "same as trailing_same_tenor_supply_4"
    leakage_mitigation: "same as trailing_same_tenor_supply_4"

  # ============================================================
  # NY Fed Primary Dealer Statistics predictors (core)
  # ============================================================

  - canonical_feature_name: dealer_net_position_total_ex_tips_harmonized
