# Explicit, human-reviewed allowlist for the Phase 9 release-governance
# CURRENT-TREE audit (src/treasury_auction_stress/governance/audit_cli.py).
#
# Every entry below is one specific reviewer decision that one specific
# matched VALUE (identified only by its non-reversible fingerprint, never
# its own content) is not sensitive AT the exact repo-relative path(s)
# listed in its `paths:` field -- never a blanket exemption by category
# or directory, and never a value-anywhere exemption: the same value
# appearing at any path not listed here still fails the audit. Adding an entry is equivalent to a manual code-review
# sign-off: only add one after personally confirming the underlying
# value is synthetic, a deliberately-fake test canary, or benign prose,
# never because a value is merely "probably fine" or inconvenient.
#
# This file is loaded ONLY by audit_cli.py's current-tree scan. It is
# NEVER applied to the full-history audit (history_audit.py) -- a
# finding in this project's actual git history is never suppressed,
# by design; see the Phase 9 acceptance review.
#
# Every fingerprint below was verified, during the Phase 9 acceptance
# review, to come from one of exactly two sources:
#   1. This project's OWN test suite, which deliberately contains
#      synthetic, unmistakably-fake credential- and PII-shaped strings
#      specifically so the governance scanner's own tests can assert it
#      catches them (see tests/test_release_audit.py,
#      tests/test_history_audit.py, tests/test_audit_cli.py). A
#      regex-based scanner cannot distinguish a fake secret used to
#      test the scanner from a real one by shape alone -- that
#      distinction is exactly what this human-reviewed allowlist
#      records.
#   2. Documentation prose that describes, in the abstract, the kind of
#      per-user filesystem path this scanner's home-path pattern looks
#      for, without stating an actual local path.
#
# NOTE ON THIS FILE'S OWN WORDING: several of the reason texts below
# deliberately avoid reproducing the literal trigger-shaped substrings
# they describe (e.g. a key name immediately followed by "=" or ":",
# or a quoted "category:subcategory"-shaped finding-category string) --
# doing so verbatim would make this documentation file itself match the
# very patterns it is explaining, which happened during drafting and was
# corrected. Describe, don't reproduce.
#
# Adding a NEW test with a NEW fake secret/PII value will require a NEW
# reviewed entry here (or the current-tree audit will correctly fail on
# it) -- this is intentional friction, not a bug.

