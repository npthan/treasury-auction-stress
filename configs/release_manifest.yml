# Public-release manifest and accepted-artifact checksums.
#
# Machine-readable source of truth for (1) what the public snapshot's
# tracked tree is supposed to contain, by top-level location, and
# (2) the SHA-256 digests of the accepted, generated artifacts that the
# committed dashboard aggregate and the pinned headline numbers derive
# from. Enforced by tests/test_release_manifest.py -- if a tracked file
# is added or removed, or a directory that must stay untracked (e.g.
# reports/ or artifacts/) gains a tracked file, that test fails until
# this manifest is deliberately updated.
#
# Generated reports/figures are intentionally untracked: generation
# CLIs write them to the gitignored artifacts/ directory on demand --
# see docs/reproducibility.md.

tracked_file_counts:
  src: 97
  tests: 92
  docs: 9
  configs: 7
  dashboard: 4
  data: 3          # the three .gitkeep placeholders only
  ".github": 1
  top_level: 6     # LICENSE, README.md, pyproject.toml, uv.lock, .gitignore, .python-version
  total: 219

must_stay_untracked_prefixes:
  - reports/
  - artifacts/
  - data/raw/      # except the .gitkeep placeholder
  - data/interim/  # except the .gitkeep placeholder
  - data/processed/  # except the .gitkeep placeholder
  - .venv/

# SHA-256 of the one committed generated artifact. The dashboard reads
# exactly this file; if it changes, the change must be deliberate and
# this digest updated in the same commit.
committed_artifact_checksums:
  dashboard/data/phase8_dashboard_data.json: "cb2b904bbb47775fb9d245f261c58b5ed9ef46083cbd8ac214f0a4c11b1e6283"

